# DigitalOcean App Platform spec for GeoGlobally (app name: shark-app).
#
# This mirrors the live app's topology. The authoritative spec lives in DO;
# keep this file in sync as a reference / for re-creation.
#   Update live:  doctl apps update <APP_ID> --spec .do/app.yaml
#   Recreate:     doctl apps create --spec .do/app.yaml
#
# Note: SESSION_SECRET below is a placeholder — the real value is set as an
# encrypted env var in the DO dashboard, not committed here.

name: shark-app
region: nyc # live region (US — sizeable US Georgian audience)

# ---------------------------------------------------------------------------
# Web service: the Next.js standalone server (Dockerfile CMD = node server.js)
# ---------------------------------------------------------------------------
services:
  - name: forum
    dockerfile_path: /Dockerfile
    source_dir: /
    github:
      repo: shako-a/Forum
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /en # returns 200 (the bare "/" 307-redirects to /<locale>)
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # Signs session JWTs. Set as an encrypted secret in the DO dashboard.
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_openssl_rand_base64_32
      # SSL handling for the managed cert lives in src/lib/pg-adapter.ts. Switch
      # to the POOLED (PgBouncer) connection once a pool is added to the DB.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${forum-db.DATABASE_URL}
      # DigitalOcean Spaces (media uploads). Set the two secrets in the
      # dashboard; bucket/region are plain. Uploads no-op until all four exist.
      - key: SPACES_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_SPACES_ACCESS_KEY
      - key: SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_SPACES_SECRET
      - key: SPACES_BUCKET
        scope: RUN_TIME
        value: forum-media
      - key: SPACES_REGION
        scope: RUN_TIME
        value: nyc3
      # Anthropic (Ask AI + discussion summaries). Set the secret in the
      # dashboard; AI features no-op until it exists.
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_ANTHROPIC_API_KEY

      # Resend (transactional email: password reset + email verification).
      # Set the secret in the dashboard; both email flows degrade gracefully
      # until RESEND_API_KEY + EMAIL_FROM both exist. Use a verified subdomain
      # sender. APP_URL makes email links point at the canonical domain (falls
      # back to the request host if unset — update it when the custom domain
      # goes live).
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_RESEND_API_KEY
      - key: EMAIL_FROM
        scope: RUN_TIME
        value: GeoGlobally <noreply@send.geoglobally.com>
      - key: APP_URL
        scope: RUN_TIME
        value: https://shark-app-7ngpy.ondigitalocean.app

# ---------------------------------------------------------------------------
# Pre-deploy job: apply migrations before each new version goes live.
# Runs from /migrate (isolated Prisma CLI). `sh -c` because Dockerfile
# components exec the command without a shell.
# ---------------------------------------------------------------------------
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: /Dockerfile
    source_dir: /
    github:
      repo: shako-a/Forum
      branch: main
    run_command: 'sh -c "cd /migrate && npx prisma migrate deploy"'
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${forum-db.DATABASE_URL}

# ---------------------------------------------------------------------------
# Managed PostgreSQL. `production: false` is the dev DB. Convert to a managed
# cluster (with a standby node) + connection pooling before real traffic.
# ---------------------------------------------------------------------------
databases:
  - name: forum-db
    engine: PG
    version: "17"
    production: false
