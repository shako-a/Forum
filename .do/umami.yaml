# DigitalOcean App Platform spec for a self-hosted Umami analytics server.
#
# This is a SEPARATE app from the forum (shark-app) — it runs the Umami
# dashboard + tracking API and owns its own database. The forum only loads a
# tiny script from it (see UMAMI_SRC / UMAMI_WEBSITE_ID in .do/app.yaml).
#
#   Create:  doctl apps create --spec .do/umami.yaml
#   Update:  doctl apps update <APP_ID> --spec .do/umami.yaml
#
# After creating it:
#   1. In the dashboard set APP_SECRET (encrypted) to a random string:
#        openssl rand -base64 32
#   2. Add the domain  analytics.geoglobally.com  (App Platform provisions TLS).
#      Add a CNAME at your DNS pointing analytics -> the app's ondigitalocean.app host.
#   3. Open the app URL, log in with the default admin / umami, and CHANGE THE
#      PASSWORD immediately (Settings -> Profile).
#   4. Add a website in Umami for geoglobally.com -> copy its Website ID (UUID)
#      into the forum's UMAMI_WEBSITE_ID, set UMAMI_SRC, and redeploy the forum.
#
# Umami is cookieless and stores no personal data, listens on port 3000, and
# runs its own schema migrations automatically on first boot.

name: geoglobally-umami
region: nyc # same region as the forum keeps the tracking round-trip local

services:
  - name: umami
    # Official image from GitHub Container Registry (the postgres build).
    image:
      registry_type: GHCR
      registry: umami-software
      repository: umami
      tag: postgresql-latest
    http_port: 3000
    instance_count: 1
    # 512MB is enough for a small community; bump to apps-s-1vcpu-1gb if the
    # dashboard feels slow or the instance restarts under load.
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/heartbeat
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${umami-db.DATABASE_URL}
      - key: DATABASE_TYPE
        scope: RUN_TIME
        value: postgresql
      # Salt for hashing — set to a random 32-byte string in the dashboard.
      - key: APP_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_openssl_rand_base64_32

databases:
  - name: umami-db
    engine: PG
    version: "16"
    production: false # dev DB; fine for analytics. Upgrade later if volume grows.
